name: Link live portfolio landing

on:
  push:
    branches:
      - cc/link-live-portfolio-landing

permissions:
  contents: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[profile-link-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cc/link-live-portfolio-landing
          fetch-depth: 0
      - run: python scripts/link_live_portfolio.py
      - shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "[profile-link-generated] Add live portfolio and methods entry points"
          git push origin HEAD:cc/link-live-portfolio-landing
